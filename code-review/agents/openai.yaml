interface:
  display_name: "Code review"
  short_description: "Find bugs, unsafe types, and broken error handling. Use when user asks for a `code review` or `review code`"
  default_prompt: "Use $code-review to find substantiated bugs, type-safety defects, and error-handling failures in the specified code, recommend fixes, and report findings by severity without editing."
policy:
  allow_implicit_invocation: true
