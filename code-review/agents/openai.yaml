interface:
  display_name: "Code review"
  short_description: "Review code for slop, correctness, and simplicity"
  default_prompt: "Use $code-review to review all work in the current PR, the last X commits if specified, or the selected thread. Check for slop, correctness, file organization, and the simplest solution that preserves required behavior."
policy:
  allow_implicit_invocation: true
